name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  banc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests du banc (aucun appel de modèle)
        run: python3 -m unittest discover -s tests -v
      - name: Variantes du plugin valides
        run: python3 teardown/variants.py
      - name: Tâches faisables et vérifiables
        run: python3 teardown/taches.py --check
      - name: Page de démo à jour
        run: python3 teardown/build_site.py --check
